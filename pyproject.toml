[tool.poetry]
name = "auth"
version = "0.1.0"
description = ""
authors = ["Nikita Vakula <programmistov.programmist@gmail.com>"]
readme = "README.md"
packages = [{include = "auth", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
pyotp = "^2.8.0"
qrcode = {extras = ["pil"], version = "^7.4.2"}
